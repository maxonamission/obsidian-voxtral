name: Release Obsidian Plugin

on:
  push:
    tags:
      - "*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Extract release notes for this version
        # Pull just this version's section out of CHANGELOG.md (the tag is the
        # bare version, e.g. "1.4.2") for use as the release body. Falls back to
        # an empty body so the auto-generated notes still appear.
        run: |
          VERSION="${GITHUB_REF_NAME}"
          : > RELEASE_NOTES.md
          if [ -f CHANGELOG.md ]; then
            awk -v v="$VERSION" '
              $0 ~ ("^## \\[" v "\\]") { f=1; next }
              /^## \[/ && f { exit }
              f { print }
            ' CHANGELOG.md > RELEASE_NOTES.md
          fi
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be  # v2.4.0
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2.6.2
        with:
          body_path: RELEASE_NOTES.md
          generate_release_notes: true
          # A tag with a -suffix (e.g. 1.9.0-beta.1) is a BRAT beta: marked as
          # prerelease so Obsidian's stable updater (releases/latest) never
          # sees it, while BRAT testers can opt in explicitly.
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            main.js
            manifest.json
            styles.css
